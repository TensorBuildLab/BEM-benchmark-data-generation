# Generic plausibility rules applied to every reference model (gate G3).
# Item fact sheets add tighter, item-specific ranges for assumed values.
# severity: blocking stops release; major must be resolved or justified; minor is reported.
rules:
  - {id: PL-unmet-heat, facet: control, severity: major, text: "occupied heating setpoint not met <= 300 h/yr",
     check: {path: results.unmet_occupied_heating_h, op: range, max: 300},
     when: {path: control.any_heating, op: "true"}}
  - {id: PL-unmet-cool, facet: control, severity: major, text: "occupied cooling setpoint not met <= 300 h/yr",
     check: {path: results.unmet_occupied_cooling_h, op: range, max: 300},
     when: {path: control.any_cooling, op: "true"}}
  - {id: PL-heat-below-cool, facet: control, severity: major, text: "heating setpoint below cooling setpoint in every dual zone",
     check: {path: control.heating_setpoint, op: range, min: 10, max: 26}}
  - {id: PL-cool-sp, facet: control, severity: minor, text: "cooling setpoint 21-32 C",
     check: {path: control.cooling_setpoint, op: range, min: 21, max: 32}}
  - {id: PL-lpd, facet: loads, severity: minor, text: "lighting power density 0-20 W/m2",
     check: {path: loads.lpd_w_m2, op: range, min: 0, max: 20}}
  - {id: PL-epd, facet: loads, severity: minor, text: "plug/process load density 0-60 W/m2",
     check: {path: loads.epd_w_m2, op: range, min: 0, max: 60}}
  - {id: PL-occ, facet: loads, severity: minor, text: "occupant density 0-50 people per 100 m2",
     check: {path: loads.people_per_100m2, op: range, min: 0, max: 50}}
  - {id: PL-ach, facet: infiltration, severity: minor, text: "design infiltration 0.02-3 ACH",
     check: {path: infiltration.ach_design_conditioned, op: range, min: 0.02, max: 3.0}}
  - {id: PL-wall-u, facet: envelope, severity: minor, text: "exterior wall U-factor 0.1-3.5 W/m2K",
     check: {path: envelope.wall_u, op: range, min: 0.1, max: 3.5}}
  - {id: PL-win-u, facet: fenestration, severity: minor, text: "window U-factor 0.5-6.5 W/m2K",
     check: {path: fenestration.window_u, op: range, min: 0.5, max: 6.5}}
  - {id: PL-shgc, facet: fenestration, severity: minor, text: "window SHGC 0.1-0.9",
     check: {path: fenestration.window_shgc, op: range, min: 0.1, max: 0.9}}
  - {id: PL-has-windows, facet: fenestration, severity: major, text: "an occupied building has windows",
     check: {path: fenestration.n_windows, op: gt, value: 0},
     when: {path: geometry.n_conditioned_zones, op: gt, value: 0}}
  - {id: PL-ceiling, facet: geometry, severity: minor, text: "mean conditioned ceiling height 2.1-8 m",
     check: {path: geometry.mean_ceiling_height_conditioned, op: range, min: 2.1, max: 8.0}}
  - {id: PL-zone-volume, facet: geometry, severity: blocking, text: "every zone has a positive enclosed volume",
     check: {path: "geometry.zones[*].volume", op: gt, value: 1.0}}
  - {id: PL-eui, facet: outputs, severity: minor, text: "site EUI 30-2500 MJ/m2 per year",
     check: {path: results.eui_mj_m2, op: range, min: 30, max: 2500},
     when: {path: meta.annual_run, op: "true"}}
